[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-analytics"
version = "0.1.0"
description = "Google Analytics for agents: see which AI agents visit your site and what they want"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-analytics = "agent_analytics.__main__:main"

[tool.setuptools]
packages = ["agent_analytics"]
